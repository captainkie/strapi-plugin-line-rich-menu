name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:coverage
      - run: pnpm build

  mutation:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:mutation

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google/osv-scanner-action/osv-scanner-action@v2.5.1
        with:
          scan-args: |-
            --lockfile=./pnpm-lock.yaml

  codeql:
    # CodeQL ต้องมี GitHub Advanced Security ซึ่งเป็นสินค้าระดับ organization
    # repo นี้เป็นของบัญชีส่วนตัวและยัง private อยู่ จึงเปิดใช้ไม่ได้เชิงโครงสร้าง ไม่ใช่แค่ยังไม่เปิดสวิตช์
    # ปล่อย job ไว้แบบมีเงื่อนไข เพื่อให้มันเริ่มทำงานเองวันที่ repo เปิด public ตอนปล่อย 1.0.0
    # ไม่ลบทิ้ง เพราะจะลืม และไม่ปล่อยให้แดงค้าง เพราะ CI ที่แดงตลอดสอนให้คนเลิกอ่าน CI
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with: { languages: javascript-typescript }
      - uses: github/codeql-action/analyze@v3
