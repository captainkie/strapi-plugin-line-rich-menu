name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # มิวเทชันเทสต์ (ดู job `mutation` ด้านล่าง) ช้าเกินจะรันทุก push/PR แต่ยังต้องรันสม่ำเสมอ
    # ตามสเปก 13.4 ("mutation (core, nightly)") — 02:00 UTC ทุกคืน ไม่ใช่ required check ของ PR ใด ๆ
    # (ดู .github/rulesets/main.json — "mutation" ไม่อยู่ใน required_status_checks)
    - cron: '0 2 * * *'

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:coverage
      - run: pnpm build
      - name: ตรวจว่า dist/browser.{js,cjs} ไม่มี sharp หลุดเข้ามา
        # ตรวจ import/require จริงเท่านั้น ไม่ใช่คำว่า "sharp" ลอย ๆ — .d.ts มีคำนี้ใน
        # JSDoc comment (browser.d.ts) ซึ่งเป็น false positive ถ้า grep ทั้งไฟล์ จึงเช็คแค่
        # .js/.cjs ที่รันจริง เทียบกับ tests/browser.test.ts ที่ตรวจแค่ที่ต้นทาง (src) —
        # ด่านนี้ตรวจที่ dist (สิ่งที่ผู้บริโภคแพ็กเกจได้จริง) และจับได้ทั้งการ import sharp
        # กลับเข้ามาซ้ำและโมดูลผูก Node ใหม่ ๆ ที่เพิ่มเข้า src/browser.ts ในอนาคต
        run: |
          if grep -nE "from ['\"]sharp['\"]|require\(['\"]sharp['\"]\)" \
            packages/core/dist/browser.js packages/core/dist/browser.cjs; then
            echo "::error::sharp ถูก import เข้า packages/core/dist/browser.{js,cjs} — subpath \"./browser\" ต้องรันในเบราว์เซอร์ได้โดยไม่มี sharp"
            exit 1
          fi
      - name: ตรวจว่า dist/browser.{js,cjs} ไม่มีชั้น server หลุดเข้ามา
        # เทสต์ import-guard ตรวจที่ต้นทาง (src) ขั้นนี้ตรวจที่ dist ซึ่งเป็นสิ่งที่ผู้บริโภคได้จริง
        # SERVER_MODULE_MARKER เป็นค่าคงที่ที่มีอยู่ที่เดียวในโค้ดเบส การเจอมันใน browser bundle
        # แปลว่า tree-shaking ไม่ได้ตัด server/ ออก ไม่ว่าจะเข้ามาทางไหน
        run: |
          if grep -n "line-rich-menu/server" \
            packages/core/dist/browser.js packages/core/dist/browser.cjs; then
            echo "::error::ชั้น server หลุดเข้า packages/core/dist/browser.{js,cjs} — subpath \"./browser\" ต้องไม่มีโค้ดฝั่งเซิร์ฟเวอร์"
            exit 1
          fi

  e2e-v4:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # สเปก §13.4 — matrix db เป็นด่านที่พิสูจน์ว่า lock query ของ scheduler (คำนวณเส้นตาย
      # ใน JS ไม่ใช่ INTERVAL ของ Postgres) ทำงานได้จริงทั้งสอง dialect ไม่ใช่แค่ที่เราเดา
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: strapi
          POSTGRES_PASSWORD: strapi
          POSTGRES_DB: strapi
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # เรียกสคริปต์ตัวเดียวกับที่คนรันบนเครื่อง ไม่ใช่เขียนลำดับขั้นซ้ำใน YAML —
      # ลำดับใน scripts/e2e.sh มีด่านที่ตัดสินผลอยู่หลายจุด (ปลั๊กอินถูกโหลดจริงไหม, node_modules
      # ได้ไบต์ของ tarball รอบนี้ไหม) การคัดลอกขั้นตอนมาไว้ที่นี่แปลว่า CI กับเครื่องจะเดินคนละทาง
      # ทันทีที่ฝั่งใดฝั่งหนึ่งถูกแก้ ซึ่งเป็นวิธีที่ทำให้ gate เขียวโดยไม่ได้วัดของจริง
      #
      # ค่า DATABASE_* ส่งผ่าน env ไม่ใช่แก้ .env — สคริปต์ให้ env ภายนอกชนะไฟล์เสมอ
      # ถ้าไม่เป็นแบบนั้น ขา postgres จะถูก .env ดึงกลับไปเป็น sqlite แล้วเขียวทั้งสองขา
      # โดยไม่เคยแตะ Postgres เลย
      - name: acceptance gate — Strapi 4.25.11 ตัวจริง + ปลั๊กอินจาก tarball
        env:
          DATABASE_CLIENT: ${{ matrix.db }}
          DATABASE_HOST: 127.0.0.1
          DATABASE_PORT: '5432'
          DATABASE_NAME: strapi
          DATABASE_USERNAME: strapi
          DATABASE_PASSWORD: strapi
        run: pnpm e2e:v4

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-v4-${{ matrix.db }}
          path: |
            examples/v4-app/test-results
            examples/v4-app/.tmp-strapi.log
            examples/v4-app/.tmp-line-mock.log

  mutation:
    runs-on: ubuntu-latest
    # Node 22 โดยตั้งใจ ต่างจาก job อื่นที่ใช้ .nvmrc — @stryker-mutator/core@10 ประกาศ
    # engines.node >= 22 ส่วน .nvmrc ตรึงไว้ที่ 20.20.0 เพราะนั่นคือเวอร์ชันที่ลูกค้ารันจริง
    # และเป็นเวอร์ชันที่ต้องพิสูจน์ว่า *ตัวสินค้า* ทำงานได้ เครื่องมือวัด mutation ไม่ใช่ของที่
    # ปล่อยออกไป จึงไม่จำเป็นต้องรันบนพื้นเดียวกับสินค้า — บังคับให้มันลงมาที่ 20 คือการเลือก
    # เครื่องมือที่แย่ลงเพื่อความสม่ำเสมอที่ไม่ได้ให้อะไรกลับมา
    # เดิมรันเฉพาะ push (ซึ่ง trigger แค่ตอน merge เข้า main แล้ว) เท่ากับ ruleset ของ main
    # (.github/rulesets/main.json) บังคับให้เป็น required check ไม่ได้เพราะ Stryker รันหลัง merge
    # เสมอ — ช้าเกินจะเป็น required check ของ PR ตั้งใจไว้แบบนั้น (ดูสเปก 13.4) แต่ก็ต้องมีทางรัน
    # แบบ nightly เพื่อให้ยังจับ mutant ที่ตกหล่นได้สม่ำเสมอ ไม่ใช่แค่ตอน push เข้า main เท่านั้น
    if: github.event_name == 'push' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:mutation

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ประตูนี้กั้นเฉพาะ dependency ที่ "เราเลือกเองและปล่อยออกไปจริง" เหตุผลเต็มอยู่ในหัวไฟล์
  # scripts/audit-shipped.mjs — โดยย่อคือ Strapi 4.25.x EOL ไปแล้วตั้งแต่ 30 เมษายน 2026 และ
  # ต้นไม้ dependency ของมันมีช่องโหว่ที่รู้จักแล้วเกิน 70 รายการซึ่งจะไม่มีวันได้แพตช์ เราไม่ได้พา
  # มันเข้ามา (`@strapi/strapi` เป็น peerDependency) และแก้ไม่ได้ การกั้นทั้งไฟล์ล็อกจึงทำให้ CI
  # แดงตลอดกาลด้วยเรื่องที่ทำอะไรไม่ได้ ซึ่งจบลงที่คนเลิกอ่านมัน แล้ววันที่ sharp หรือ zod มี
  # ช่องโหว่จริงก็จะไม่มีใครสังเกต
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/audit-shipped.mjs

  # ไม่บล็อก แต่ต้องยังเห็น — สถานะของต้นไม้ Strapi 4 เป็นข้อมูลที่ลูกค้าควรได้รู้ ไม่ใช่ของที่ปิดปาก
  # ถ้าวันหนึ่งเลิกรองรับ v4 แล้ว job นี้ควรกลับมาบล็อกอีกครั้ง
  dependencies-upstream:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: google/osv-scanner-action/osv-scanner-action@v2.5.1
        with:
          scan-args: |-
            --lockfile=./pnpm-lock.yaml

  codeql:
    # CodeQL ต้องมี GitHub Advanced Security ซึ่งเป็นสินค้าระดับ organization
    # repo นี้เป็นของบัญชีส่วนตัวและยัง private อยู่ จึงเปิดใช้ไม่ได้เชิงโครงสร้าง ไม่ใช่แค่ยังไม่เปิดสวิตช์
    # ปล่อย job ไว้แบบมีเงื่อนไข เพื่อให้มันเริ่มทำงานเองวันที่ repo เปิด public ตอนปล่อย 1.0.0
    # ไม่ลบทิ้ง เพราะจะลืม และไม่ปล่อยให้แดงค้าง เพราะ CI ที่แดงตลอดสอนให้คนเลิกอ่าน CI
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with: { languages: javascript-typescript }
      - uses: github/codeql-action/analyze@v3
