# ต่อยอดจากกฎมาตรฐานของ gitleaks ไม่ใช่แทนที่ — `useDefault` คือสิ่งที่ทำให้กฎทั้งหมดยังทำงานอยู่
# ถ้าไฟล์นี้ประกาศกฎเองโดยไม่มีบรรทัดนี้ การสแกนจะเหลือเฉพาะกฎที่เขียนไว้เอง ซึ่งคือการปิดตัวตรวจ
# ทั้งชุดโดยไม่ตั้งใจ และจะดู "เขียว" กว่าเดิมด้วย
[extend]
useDefault = true

# ---------------------------------------------------------------------------------------------
# ทำไมต้องมีไฟล์นี้ ทั้งที่มี .gitleaksignore อยู่แล้ว
#
# gitleaks สแกน **ประวัติ** และคำนวณ fingerprint เป็น `commit:file:rule:line` — ค่าคงที่ปลอมค่าเดียว
# ที่ถูกแตะใน 3 commit จึงกลายเป็น 3 finding คนละ fingerprint การไล่ใส่ .gitleaksignore ทีละอัน
# จึงเป็นการตีตัวตุ่น: ครอบไว้ 2 อัน แล้ววันหนึ่ง gitleaks อัปเวอร์ชัน (CI ใช้ 8.24.3, เครื่องใช้
# 8.30.1) ก็โผล่ commit ที่สามที่ยังไม่ได้ครอบ — ซึ่งเกิดขึ้นจริง ทำให้ job `secrets` ของ nightly
# แดงค้างมาสองคืน
#
# job ความปลอดภัยที่แดงตลอดกาลคือ job ที่คนเลิกอ่าน แล้ววันที่มันแดงเพราะของจริงก็จะไม่มีใครสังเกต
# (เหตุผลเดียวกับที่ SECURITY.md อธิบายไว้เรื่อง advisory ของ Strapi 4)
#
# สิ่งที่ยกเว้นตรงนี้จึงเป็น **ค่านั้นค่าเดียว** ไม่ใช่ commit ไม่ใช่ path ไม่ใช่กฎ:
# `0123456789abcdef0123456789abcdef` คือเลขฐานสิบหกเรียงตามลำดับที่พิมพ์ด้วยมือ ใช้เป็น
# *ข้อความที่ถูกเข้ารหัส* ในเทสต์ของ AES-256-GCM ไม่ใช่กุญแจที่ใช้เข้ารหัส ความลับจริงไม่มีวัน
# เท่ากับค่านี้ การยกเว้นจึงไม่เปิดช่องให้ของจริงหลุดผ่าน ต่างจากการยกเว้นทั้งไฟล์หรือทั้งกฎ
#
# ไฟล์เทสต์ปัจจุบันเขียนใหม่ให้ดูปลอมชัดเจนแล้ว (`not-a-real-channel-secret-for-tests-only`)
# ที่เหลือคือ commit เก่าซึ่งแก้ไม่ได้ — ประวัติเปลี่ยนไม่ได้ และการ rewrite ประวัติของ repo ที่
# public ไปแล้วไม่ได้ทำให้อะไรที่หลุดไปแล้วกลับคืนมา
[allowlist]
description = "fixture ปลอมของเทสต์ AES-256-GCM ที่อยู่ในประวัติและลบไม่ได้"
regexes = ['''0123456789abcdef0123456789abcdef''']
