# Render reads this file to create/update the demo service. The image is already built by
# .github/workflows/demo-image.yml — there is no `buildCommand` here on purpose. See
# docs/DEMO.md ("Why the image is built in CI") for the measured reason Render's own free
# instance never runs `strapi build` itself.
#
# One service only (Ruling E, Amendment 2 of the v5-and-release plan): the LINE mock that the
# demo talks to runs as a second process *inside* this same container
# (examples/v5-app/docker-entrypoint.sh), not as a second Render service — two free services
# sleep independently, so a visitor waking Strapi would hit a still-cold mock and see a
# timeout that looks like the plugin is broken. LINE_API_BASE_URL / LINE_API_DATA_BASE_URL
# below point at 127.0.0.1, the same container, not at a dashboard-filled value.
services:
  - type: web
    name: line-rich-menu-demo
    runtime: image
    plan: free
    # Same region as `autoflow-demo-api`, an unrelated project already running in this Render
    # workspace — it is the owner's own Thai-timezone infrastructure, and Ruling B in the
    # amendment explains why the two share a free-hour pool rather than each getting one.
    region: singapore
    image:
      url: ghcr.io/captainkie/line-rich-menu-demo:latest
    healthCheckPath: /admin
    envVars:
      # ทุกตัวที่ sync: false ต้องกรอกในหน้า dashboard ครั้งเดียว — ห้ามมีค่าจริงในไฟล์นี้
      - key: APP_KEYS
        sync: false
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: API_TOKEN_SALT
        generateValue: true
      - key: TRANSFER_TOKEN_SALT
        generateValue: true
      - key: LINE_RM_ENCRYPTION_KEY
        generateValue: true
      # Neon — free and does not pause permanently the way Supabase/Aiven's free tiers do; it
      # scale-to-zeros after 5 minutes idle and wakes on the next query instead.
      # config/database.js reads DATABASE_URL as a single connection string when present —
      # see docs/tests/demo.test.ts for the test that proves it, and .github/workflows/ci.yml
      # for the DATABASE_HOST/PORT/... path this does not touch (that one still applies when
      # DATABASE_URL is absent).
      - key: DATABASE_CLIENT
        value: postgres
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: 'true'
      # Cloudinary — required, not optional: Render free's disk is ephemeral, so anything
      # saved to public/uploads vanishes on the next deploy or cold start. config/plugins.js
      # switches to the Cloudinary provider automatically whenever CLOUDINARY_NAME is set.
      - key: CLOUDINARY_NAME
        sync: false
      - key: CLOUDINARY_KEY
        sync: false
      - key: CLOUDINARY_SECRET
        sync: false
      # tools/line-mock running in-container, bound to 127.0.0.1 — not LINE's real API, and
      # not a second Render service. See docker-entrypoint.sh and docs/DEMO.md.
      - key: LINE_API_BASE_URL
        value: http://127.0.0.1:4011
      - key: LINE_API_DATA_BASE_URL
        value: http://127.0.0.1:4011
      - key: LINE_RM_SCHEDULER
        value: 'true'
